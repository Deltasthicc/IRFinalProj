<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="1000" height="560" fill="white"/><path d="M 220,72 L 260,72" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 460,72 L 500,72" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 700,72 L 740,72" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 560,108 L 560,138" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 640,108 L 640,122 L 840,122 L 840,138" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 220,278 L 260,278" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 460,278 L 500,278" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 700,278 L 740,278" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 840,314 L 840,382" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 740,418 L 700,418" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 500,418 L 460,418" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><path d="M 260,418 L 220,418" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><text x="20" y="26" font-size="12" font-weight="700" fill="#1b7f5c">OFFLINE: build the collection, indexes and graph (Role A)</text><rect x="20" y="36" width="200" height="72" rx="8" fill="#e3f2ec" stroke="#1b7f5c" stroke-width="1.5"/><text x="120.0" y="60" text-anchor="middle" font-size="13" font-weight="700">SEC EDGAR</text><text x="120.0" y="78" text-anchor="middle" font-size="10.5" fill="#444">20 companies, latest 10-K</text><rect x="260" y="36" width="200" height="72" rx="8" fill="#e3f2ec" stroke="#1b7f5c" stroke-width="1.5"/><text x="360.0" y="60" text-anchor="middle" font-size="13" font-weight="700">Polite crawler</text><text x="360.0" y="78" text-anchor="middle" font-size="10.5" fill="#444">User-Agent, rate limit, cache</text><rect x="500" y="36" width="200" height="72" rx="8" fill="#e3f2ec" stroke="#1b7f5c" stroke-width="1.5"/><text x="600.0" y="60" text-anchor="middle" font-size="13" font-weight="700">Parse + chunk</text><text x="600.0" y="78" text-anchor="middle" font-size="10.5" fill="#444">Items, passages, one chunk</text><text x="600.0" y="92" text-anchor="middle" font-size="10.5" fill="#444">per table</text><rect x="740" y="36" width="200" height="72" rx="8" fill="#e3f2ec" stroke="#1b7f5c" stroke-width="1.5"/><text x="840.0" y="60" text-anchor="middle" font-size="13" font-weight="700">Text indexes</text><text x="840.0" y="78" text-anchor="middle" font-size="10.5" fill="#444">positional index, k-gram</text><text x="840.0" y="92" text-anchor="middle" font-size="10.5" fill="#444">dense vectors</text><rect x="500" y="138" width="200" height="60" rx="8" fill="#f0eafd" stroke="#7a5fc0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="600.0" y="162" text-anchor="middle" font-size="13" font-weight="700">Vision track (gated)</text><text x="600.0" y="180" text-anchor="middle" font-size="10.5" fill="#444">page images, MaxSim</text><rect x="740" y="138" width="200" height="60" rx="8" fill="#e3f2ec" stroke="#1b7f5c" stroke-width="1.5"/><text x="840.0" y="162" text-anchor="middle" font-size="13" font-weight="700">Company mention graph</text><text x="840.0" y="180" text-anchor="middle" font-size="10.5" fill="#444">PageRank + HITS</text><text x="20" y="232" font-size="12" font-weight="700" fill="#2d62b5">ONLINE 1: retrieve (query side is Role C, rankers are Role B)</text><rect x="20" y="242" width="200" height="72" rx="8" fill="#e1ebfa" stroke="#d9822b" stroke-width="3"/><text x="120.0" y="266" text-anchor="middle" font-size="13" font-weight="700">User question</text><text x="120.0" y="284" text-anchor="middle" font-size="10.5" fill="#444">e.g. &quot;Compare Appel and</text><text x="120.0" y="298" text-anchor="middle" font-size="10.5" fill="#444">Tesla supply risk&quot;</text><rect x="260" y="242" width="200" height="72" rx="8" fill="#e1ebfa" stroke="#d9822b" stroke-width="3"/><text x="360.0" y="266" text-anchor="middle" font-size="13" font-weight="700">Query processor</text><text x="360.0" y="284" text-anchor="middle" font-size="10.5" fill="#444">entity + spelling (bigram, Levenshtein)</text><text x="360.0" y="298" text-anchor="middle" font-size="10.5" fill="#444">compare split, section prior</text><rect x="500" y="242" width="200" height="72" rx="8" fill="#e1ebfa" stroke="#2d62b5" stroke-width="1.5"/><text x="600.0" y="266" text-anchor="middle" font-size="13" font-weight="700">Retrievers</text><text x="600.0" y="284" text-anchor="middle" font-size="10.5" fill="#444">Boolean, TF-IDF, BM25, dense,</text><text x="600.0" y="298" text-anchor="middle" font-size="10.5" fill="#444">hybrid (RRF), champion lists</text><rect x="740" y="242" width="200" height="72" rx="8" fill="#e1ebfa" stroke="#2d62b5" stroke-width="1.5"/><text x="840.0" y="266" text-anchor="middle" font-size="13" font-weight="700">Cross-encoder reranker</text><text x="840.0" y="284" text-anchor="middle" font-size="10.5" fill="#444">re-scores pairs, keeps top-5</text><text x="20" y="372" font-size="12" font-weight="700" fill="#5b3fb0">ONLINE 2: generate a cited, checked answer (Role C, flows right to left)</text><rect x="740" y="382" width="200" height="72" rx="8" fill="#ece6fa" stroke="#d9822b" stroke-width="3"/><text x="840.0" y="406" text-anchor="middle" font-size="13" font-weight="700">Context builder</text><text x="840.0" y="424" text-anchor="middle" font-size="10.5" fill="#444">top-5 passages labelled</text><text x="840.0" y="438" text-anchor="middle" font-size="10.5" fill="#444">[P1]..[P5] + metadata</text><rect x="500" y="382" width="200" height="72" rx="8" fill="#ece6fa" stroke="#d9822b" stroke-width="3"/><text x="600.0" y="406" text-anchor="middle" font-size="13" font-weight="700">LLM (temp 0, cached)</text><text x="600.0" y="424" text-anchor="middle" font-size="10.5" fill="#444">answer only from passages,</text><text x="600.0" y="438" text-anchor="middle" font-size="10.5" fill="#444">cite, or INSUFFICIENT EVIDENCE</text><rect x="260" y="382" width="200" height="72" rx="8" fill="#ece6fa" stroke="#d9822b" stroke-width="3"/><text x="360.0" y="406" text-anchor="middle" font-size="13" font-weight="700">Verifier + abstention</text><text x="360.0" y="424" text-anchor="middle" font-size="10.5" fill="#444">cited ids exist, numbers in</text><text x="360.0" y="438" text-anchor="middle" font-size="10.5" fill="#444">cited text, score vs tau</text><rect x="20" y="382" width="200" height="72" rx="8" fill="#ece6fa" stroke="#d9822b" stroke-width="3"/><text x="120.0" y="406" text-anchor="middle" font-size="13" font-weight="700">Streamlit app</text><text x="120.0" y="424" text-anchor="middle" font-size="10.5" fill="#444">Ask | Search | Filing graph | Pages</text><text x="120.0" y="438" text-anchor="middle" font-size="10.5" fill="#444">trust panel</text><text x="20" y="492" font-size="12" font-weight="700" fill="#666666">EVALUATION (separate scripts, same pipeline)</text><rect x="20" y="502" width="200" height="50" rx="8" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><text x="120.0" y="526" text-anchor="middle" font-size="13" font-weight="700">Test collection</text><text x="120.0" y="544" text-anchor="middle" font-size="10.5" fill="#444">30 needs, pooled judgments</text><rect x="260" y="502" width="200" height="50" rx="8" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><text x="360.0" y="526" text-anchor="middle" font-size="13" font-weight="700">Retrieval metrics</text><text x="360.0" y="544" text-anchor="middle" font-size="10.5" fill="#444">P/R/F1, MAP, nDCG, MRR</text><rect x="500" y="502" width="200" height="50" rx="8" fill="#eeeeee" stroke="#d9822b" stroke-width="3"/><text x="600.0" y="526" text-anchor="middle" font-size="13" font-weight="700">RAG + abstention (C)</text><text x="600.0" y="544" text-anchor="middle" font-size="10.5" fill="#444">ratings, citations, P/R/F1</text><rect x="740" y="502" width="200" height="50" rx="8" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><text x="840.0" y="526" text-anchor="middle" font-size="13" font-weight="700">Graph + vision</text><text x="840.0" y="544" text-anchor="middle" font-size="10.5" fill="#444">PageRank vs in-degree</text><rect x="720" y="470" width="14" height="14" rx="3" fill="white" stroke="#d9822b" stroke-width="3"/><text x="740" y="481" font-size="11" fill="#444">orange outline: query, RAG and app (Role C)</text></svg>